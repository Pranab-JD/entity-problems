[simulation]
    name    = "/scratch/project_465002528/pjd/flux_tubes/tubes"
    engine  = "srpic"
    runtime = 4.0

    [simulation.domain]
        decomposition = [-1, -1, -1]

###! GRID
[grid]
    resolution = [500, 500, 500]
    extent     = [[0.0, 20.0], [-10.0, 10.0], [0.0, 20.0]]

    [grid.metric]
        metric = "minkowski"

    [grid.boundaries]
        fields    = [["MATCH", "MATCH"],   ["MATCH", "MATCH"],   ["PERIODIC"]]
        particles = [["ABSORB", "ABSORB"], ["ABSORB", "ABSORB"], ["PERIODIC"]] 

###! ALGORITHMS
[algorithms]
    current_filters = 8

    [algorithms.timestep]
        CFL = 0.5

###! PARTICLES
[particles]
    ppc0 = 16.0

    [[particles.species]]
        label    = "e-"
        mass     = 1.0
        charge   = -1.0
        maxnpart = 2e8

    [[particles.species]]
        label    = "e+"
        mass     = 1.0
        charge   = 1.0
        maxnpart = 2e8

###! SCALES
[scales]
    larmor0    = 1.0
    skindepth0 = 1.0

###! SETUP
[setup]
    #* Plasma
    sigma        = 1.0          # Magnetisation
    background_T = 0.01         # Background temperature
    c_param      = 0.0001       # Base guide field
    
    #* Flux Tubes
    beta_kick    = 0.0          # v/c --- E x B drift

    #* Overall system
    init_rho     = true         # Charge correction (ρ = ∇⋅E) to avoid charge imbalance noise
    single_tube  = false        # True = 2 flux tubes; False = 1 flux tube
    smooth_flds  = true         # Smooth fields
    nsmooth      = 8            # Number of smoothings

###! OUTPUT
[output]
    interval = 10
    format   = "BPFile"

    [output.fields]
        quantities = ["N", "B", "E", "J"]

    [output.particles]
        enable = false

    [output.spectra]
        enable = false

###! DIAGNOSTICS
[diagnostics]
    interval  = 50
    log_level = "WARNING"

###! CHECKPOINT
[checkpoint]
    interval = 5000
    keep     = 1