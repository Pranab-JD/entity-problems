###! Relativistic Harris Sheet for PAIR plasma (e-/e+), 2D.
###! Mass ratio = 1; sigma_ion == sigma0; theta_e == theta_i.
###! Geometry (reversal across Y): inflow=Y, outflow=X. Axis map x,y -> x1,x2.
###!   X (x1): OPEN (outflow leaves the box)
###!   Y (x2): REFLECTING (default) or INJECTION (toggle setup.inject_y)
###! Lengths in d0 (electron skin depth; for d_i = d_e = d0)

[simulation]
	name    = "/scratch/project_465003132/RMR_pair_2D/theta_BG_10/RMR"
	engine  = "srpic"
	runtime = 1000.0

	[simulation.domain]
		decomposition = [-1, -1]

[grid]
	resolution = [2000, 2000]
	extent     = [[0.0, 500.0], [0.0, 500.0]]

	[grid.metric]
		metric = "minkowski"

	[grid.boundaries]
    	###* PERIODIC-X, REFLECTION-Y
        fields    = [["PERIODIC"], 	["CONDUCTOR", "CONDUCTOR"]]
		particles = [["PERIODIC"], 	["REFLECT",   "REFLECT"]]
		
        ###* OPEN-X, REFLECTION-Y
        # fields    = [["MATCH", 	"MATCH"], 	["CONDUCTOR", "CONDUCTOR"]]
		# particles = [["ABSORB", "ABSORB"], 	["REFLECT",   "REFLECT"]]

		###* OPEN-X, INJECTION-Y (also setup.inject_y=true and ds=[[2.0], [2.0]])
		# fields    = [["MATCH",  "MATCH"],  ["MATCH",  "MATCH"]]
		# particles = [["ABSORB", "ABSORB"], ["ABSORB", "ABSORB"]]

		[grid.boundaries.match]
			ds = [[5.0], [5.0]]              ###* x1: 3 d0 both walls; x2: none


[scales]
    skindepth0 = 1.0                      #* de = skindepth0 = 1.0 code unit for pair plasma
    larmor0    = 0.1                      #* sigma0 = (skindepth0/larmor0)**2


[algorithms]
  	current_filters = 4

	[algorithms.timestep]
		CFL = 0.5


[particles]
	ppc0 = 16.0

	[[particles.species]]                 ###* species 1 = electrons
		label    = "e-"
		mass     = 1.0
		charge   = -1.0
		maxnpart = 5e7

	[[particles.species]]                 ###* species 2 = positrons
		label    = "e+"
		mass     = 1.0
		charge   = 1.0
		maxnpart = 5e7


[setup]
	cs_density        = 5.0               ###* current-sheet overdensity = n_CS/n_BG
	cs_width          = 10.0              ###* half-thickness in d0
	guide_field       = 0.0               ###* guide_field / B_in-plane
	bg_theta_i        = 10.0              ###* background temperature, theta = kT/(m c^2)

	###? Y-boundary mode: MUST match [grid.boundaries] x2 choice above.
	inject_y          = false             ###* false=reflecting Y (default); true=injection
	inj_ypad          = 20.0              ###* injection only: standoff from y-walls (d0)

	###? Turbulent perturbation
	turb_amp          = 0.0               ###* if 0, the following turbulence params are ignored
	turb_seed         = 12345
	kmin              = 1
	kmax              = 2
	turb_plane        = 0                 ###* 2D: only plane 0 (xy) is meaningful
	spectral_index    = 1.6667


[output]
    format   = "BPFile"

    [output.fields]
        quantities  = ["N", "B", "E", "J"]
        interval    = 500

    [output.particles]
        enable      = false

    [output.spectra]
        enable      = true
        e_min       = 1e-5
        e_max       = 1e10
        log_bins    = true
        n_bins      = 10000
        interval    = 500
    
    [output.stats]
        quantities  = ["B^2", "E^2", "ExB", "J.E", "Rho", "T00"]
        interval    = 250


[diagnostics]
    interval  = 2000
    log_level = "WARNING"


[checkpoint]
    interval = 15000
    keep     = 1