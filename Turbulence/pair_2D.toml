###! Decaying kinetic turbulence for PAIR plasma (e-/e+), 2D
###! Mass ratio = 1  => theta_e == theta_i & sigma_e == sigma_(e+)
###! Turbulent k lies in the x1-x2 plane  => k_parallel = 0 by construction
###! ALL boundaries periodic: decaying turbulence, no driving, no inflow
###! Lengths in d0 (cold skin depth of the fiducial species)
###! c = 1, so a code time unit equals a light-crossing of 1 d0

[simulation]
	name    = "/scratch/project_465003132/DT_pair_2D/ppc_128/DT"
	engine  = "srpic"
	runtime = 2000.0

	[simulation.domain]
		decomposition = [-1, -1]


[grid]
	resolution = [4000, 4000]
	extent     = [[0.0, 500.0], [0.0, 500.0]]

	[grid.metric]
		metric = "minkowski"

	[grid.boundaries]
		fields    = [["PERIODIC"], ["PERIODIC"]]
		particles = [["PERIODIC"], ["PERIODIC"]]


[scales]
	skindepth0 = 1.0                      ###* electron/positron skin depth
	larmor0    = 1.0                      ###* electron Larmor raius; sigma0 = (skindepth0/larmor0)^2


[algorithms]
	current_filters = 4

	[algorithms.timestep]
		CFL = 0.5


[particles]
	ppc0 = 128.0

	[[particles.species]]                 ###* species 1 = electrons
		label    = "e-"
		mass     = 1.0
		charge   = -1.0
		maxnpart = 1e8

	[[particles.species]]                 ###* species 2 = positrons
		label    = "e+"
		mass     = 1.0
		charge   = 1.0
		maxnpart = 1e8


[setup]
    ###? Plasma
	bguide            = 0.0               ###* Mean/guide magnetic field (ALWAYS along Z)
	temperature       = 0.03              ###* FIDUCIAL kT/(m_fid c^2); pair plasma => theta_e = theta_e+

	###? Turbulent perturbation
	turb_amp          = 1.0               ###* RMS |dB| / B_norm  (0.0 => laminar, all turb params ignored)
	turb_seed         = 12345
    turb_rand_amp     = true              ###* Multiplies each mode’s power-law amplitude by a standard normal draw
	kmin              = 1                 ###* Minimum "k" of the perturbations
	kmax              = 8                 ###* Maximum "k" of the perturbations
	turb_kplane       = 0                 ###* 2D: MUST be 0
	turb_a_axis       = 2                 ###* Vector potential, A = A_3 e_3, along Z
	spectral_index    = 1.6667            ###* p in E(k) ~ k^-p


[output]
	format = "BPFile"

	[output.fields]
		quantities      = ["N", "B", "E", "J"]
		interval        = 500                 ###* ~25 snapshots over the run

	[output.particles]
		enable          = false

	[output.spectra]
		enable          = true
		e_min           = 1e-6
		e_max           = 1e6
		log_bins        = true
		num_energy_bins = 1200
		interval        = 500

	[output.stats]
		quantities      = ["B^2", "E^2", "ExB", "J.E", "Rho", "T00"]
		interval        = 100


[diagnostics]
	interval  = 2000
	log_level = "WARNING"


[checkpoint]
	interval = 5000
	keep     = 1