[simulation]
    name    = "/scratch/project_465002544/pranab/flux_tubes_CG/2D_FF/tubes"
    engine  = "srpic"
    runtime = 256.0

    [simulation.domain]
        decomposition = [-1, -1]


[grid]
    resolution = [2560, 2560]
    extent     = [[0.0, 256.0], [0.0, 256.0]]   #* Defined in terms of de

    [grid.metric]
        metric = "minkowski"

    [grid.boundaries]
        # fields    = [["MATCH", "MATCH"],   ["MATCH", "MATCH"]]
        # particles = [["ABSORB", "ABSORB"], ["ABSORB", "ABSORB"]] 
        fields    = [["PERIODIC"], ["PERIODIC"]]
        particles = [["PERIODIC"], ["PERIODIC"]]


[algorithms]
    current_filters = 2

    [algorithms.timestep]
        CFL = 0.5


[particles]
    ppc0 = 64.0

    [[particles.species]]
        label    = "e-"
        mass     = 1.0
        charge   = -1.0
        maxnpart = 2e8

    [[particles.species]]
        label    = "e+"
        mass     = 1.0
        charge   = 1.0
        maxnpart = 2e8


[scales]
    skindepth0 = 1.0                      #* de = skindepth0 = 1.0 code unit for pair plasma
    larmor0    = 0.5                      #* sigma = (skindepth0/larmor0)**2
    

[setup]
    #* Plasma
    background_temperature = 0.05         #* Background temperature (Debye length ~ sqrt(background_temperature))
    guide_field_floor      = 0.01         #* Base/floor guide field (to avoid numerical instabilities)
    charge_correction      = true
    
    #* Flux Tubes
    kick_velocity          = 0.0          #* v/c --- E x B drift
    single_tube            = false        #* False = 2 flux tubes; True = 1 flux tube


[output]
    format   = "BPFile"

    [output.fields]
        quantities  = ["N", "B", "E", "J"]
        interval    = 130

    [output.particles]
        enable      = false

    [output.spectra]
        enable          = true
        e_min           = 1e-6
        e_max           = 1e6
        log_bins        = true
        num_energy_bins = 1200
        interval        = 200
    
    [output.stats]
        quantities  = ["B^2", "E^2", "ExB", "J.E", "Rho", "T00"]
        interval    = 500


[diagnostics]
    interval  = 2000
    log_level = "WARNING"


[checkpoint]
    interval = 5000
    keep     = 1